services:
  - type: web
    name: posms
    env: node
    plan: free
    buildCommand: npm install --prefix backend
    startCommand: npm start --prefix backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        value: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        value: 3DP6TakphsvPJD5.root
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: posms
      - key: DB_SSL
        value: "true"
